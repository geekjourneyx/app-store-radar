name: Daily collector smoke
on:
  push:
    branches: [test/daily-smoke]
permissions:
  contents: read
concurrency:
  group: app-store-radar-daily-smoke-v2
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Collect evidence
        run: npm run collect -- --date 2026-09-08 --root /tmp/app-store-radar-smoke
      - name: Inspect output
        run: |
          ROOT=/tmp/app-store-radar-smoke/data/2026/09/08
          echo '--- generated files ---'
          find "$ROOT" -maxdepth 1 -type f -print -exec wc -l {} \;
          echo '--- manifest ---'
          cat "$ROOT/manifest.json"
