name: Daily collector smoke
on:
  push:
    branches: [test/daily-smoke]
permissions:
  contents: write
concurrency:
  group: app-store-radar-daily-smoke
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Collect evidence
        run: npm run collect -- --date 2026-09-08
      - name: Inspect output
        run: |
          echo '--- generated files ---'
          find data/2026/09/08 -maxdepth 1 -type f -print -exec wc -l {} \;
          echo '--- manifest ---'
          cat data/2026/09/08/manifest.json
      - name: Commit smoke evidence to branch
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "app-store-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: smoke collect App Store evidence 2026-09-08"
          git push origin HEAD:test/daily-smoke
