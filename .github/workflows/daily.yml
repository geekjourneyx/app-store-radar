name: Daily App Store collection
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-store-radar-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Collect today's evidence once
        run: |
          DATE="$(date -u +%F)"
          PARTITION="data/$(date -u +%Y)/$(date -u +%m)/$(date -u +%d)"
          if [ -d "$PARTITION" ]; then
            echo "Partition $PARTITION already exists; leaving immutable history unchanged."
            exit 0
          fi
          npm run collect -- --date "$DATE"
          echo '--- collection manifest ---'
          cat "$PARTITION/manifest.json"
      - name: Commit new evidence
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "app-store-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: collect App Store evidence $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
