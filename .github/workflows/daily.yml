name: Daily App Store radar
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-store-radar-daily
  cancel-in-progress: false
jobs:
  collect-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Collect immutable evidence and render daily brief
        run: |
          DATE="$(TZ=Asia/Shanghai date +%F)"
          PARTITION="data/$(TZ=Asia/Shanghai date +%Y)/$(TZ=Asia/Shanghai date +%m)/$(TZ=Asia/Shanghai date +%d)"
          if [ ! -d "$PARTITION" ]; then
            npm run collect -- --date "$DATE"
          else
            echo "Partition $PARTITION already exists; immutable raw evidence is unchanged."
          fi
          npm run daily -- --date "$DATE"
          echo '--- collection manifest ---'
          cat "$PARTITION/manifest.json"
      - name: Commit raw evidence and readable daily report
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git config user.name "app-store-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data evidence/daily reports/daily
          git commit -m "radar: daily evidence and report $(TZ=Asia/Shanghai date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
