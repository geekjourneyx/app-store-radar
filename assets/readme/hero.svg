<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">App Store Radar</title>
  <desc id="desc">App Store signals flow through evidence and noise filtering into BUILD, WATCH, or REJECT product opportunity verdicts.</desc>
  <rect width="1200" height="360" rx="28" fill="#0B0D10"/>

  <g id="title-block" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="64" y="76" fill="#8B949E" font-size="18" font-weight="600" letter-spacing="2">APP STORE OPPORTUNITY INTELLIGENCE</text>
    <text x="64" y="146" fill="#F3F4F6" font-size="58" font-weight="750">App Store Radar</text>
    <text x="64" y="192" fill="#C9D1D9" font-size="24">Find product opportunities from real demand,</text>
    <text x="64" y="226" fill="#C9D1D9" font-size="24">unmet needs, momentum, and feasibility.</text>

    <g transform="translate(64 274)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">
      <rect x="0" y="0" width="92" height="34" rx="17" fill="#11241C" stroke="#2EA043"/>
      <text x="46" y="23" fill="#56D364" text-anchor="middle" font-weight="700">BUILD</text>
      <rect x="106" y="0" width="94" height="34" rx="17" fill="#28210F" stroke="#D29922"/>
      <text x="153" y="23" fill="#E3B341" text-anchor="middle" font-weight="700">WATCH</text>
      <rect x="214" y="0" width="100" height="34" rx="17" fill="#2A1517" stroke="#F85149"/>
      <text x="264" y="23" fill="#FF7B72" text-anchor="middle" font-weight="700">REJECT</text>
    </g>
  </g>

  <g id="project-proof" transform="translate(610 48)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,sans-serif">
    <text x="0" y="18" fill="#8B949E" font-size="18" font-weight="600">PUBLIC SIGNALS</text>

    <g font-size="19" font-weight="650">
      <rect x="0" y="42" width="154" height="48" rx="12" fill="#12161C" stroke="#30363D"/>
      <text x="77" y="73" fill="#E6EDF3" text-anchor="middle">Search</text>
      <rect x="170" y="42" width="154" height="48" rx="12" fill="#12161C" stroke="#30363D"/>
      <text x="247" y="73" fill="#E6EDF3" text-anchor="middle">Reviews</text>
      <rect x="0" y="106" width="154" height="48" rx="12" fill="#12161C" stroke="#30363D"/>
      <text x="77" y="137" fill="#E6EDF3" text-anchor="middle">Charts</text>
      <rect x="170" y="106" width="154" height="48" rx="12" fill="#12161C" stroke="#30363D"/>
      <text x="247" y="137" fill="#E6EDF3" text-anchor="middle">Releases</text>
    </g>

    <path d="M 342 98 H 382" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 375 91 L 384 98 L 375 105" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(400 48)">
      <rect x="0" y="0" width="126" height="104" rx="16" fill="#0D1A26" stroke="#1F6FEB"/>
      <text x="63" y="36" fill="#79C0FF" font-size="17" text-anchor="middle" font-weight="700">EVIDENCE</text>
      <text x="63" y="63" fill="#C9D1D9" font-size="16" text-anchor="middle">deltas</text>
      <text x="63" y="85" fill="#8B949E" font-size="16" text-anchor="middle">+ filters</text>
    </g>

    <path d="M 463 170 V 206" stroke="#58A6FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 456 199 L 463 208 L 470 199" fill="none" stroke="#58A6FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(352 220)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect x="0" y="0" width="222" height="54" rx="14" fill="#11161D" stroke="#30363D"/>
      <text x="111" y="23" fill="#8B949E" font-size="15" text-anchor="middle">WEEKLY VERDICT</text>
      <text x="111" y="43" fill="#F0F6FC" font-size="18" text-anchor="middle" font-weight="700">opportunity, not hype</text>
    </g>
  </g>
</svg>
